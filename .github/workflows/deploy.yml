name: نشر اللعبة على GitHub Pages

on:
  push:
    branches:
      - claude/game-app-rqkj1b
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# اسمح بنشر واحد فقط في نفس الوقت
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: جلب الكود
        uses: actions/checkout@v4

      - name: إعداد Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: رفع ملفات الموقع
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: النشر
        id: deployment
        uses: actions/deploy-pages@v4
