<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#5c94fc" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<title>سوبر جري - Super Run</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon.svg" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #000;
    font-family: -apple-system, "Segoe UI", Tahoma, sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: none;
  }
  #game-wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #5c94fc;
  }
  canvas {
    display: block;
    max-width: 100%; max-height: 100%;
    background: #6ba4ff;
    touch-action: none;
  }

  /* ===== أزرار التحكم باللمس ===== */
  #controls {
    position: fixed; inset: 0; pointer-events: none; z-index: 20;
  }
  .btn {
    position: absolute; bottom: max(24px, env(safe-area-inset-bottom));
    width: 74px; height: 74px; border-radius: 50%;
    background: rgba(255,255,255,0.22);
    border: 3px solid rgba(255,255,255,0.55);
    color: #fff; font-size: 34px; font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    pointer-events: auto; backdrop-filter: blur(2px);
    transition: transform .05s, background .1s;
  }
  .btn:active, .btn.pressed { transform: scale(0.9); background: rgba(255,255,255,0.45); }
  #btn-left  { left: 20px; }
  #btn-right { left: 108px; }
  #btn-jump  { right: 24px; width: 88px; height: 88px; background: rgba(255,90,90,0.35); border-color: rgba(255,255,255,0.7); }

  /* ===== الشاشات ===== */
  .screen {
    position: fixed; inset: 0; z-index: 30;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(180deg, #5c94fc 0%, #7aa8ff 60%, #93c47d 100%);
    color: #fff; text-align: center; padding: 24px;
  }
  .screen.hidden { display: none; }
  .screen h1 { font-size: clamp(32px, 9vw, 64px); text-shadow: 3px 3px 0 #d84b3f; letter-spacing: 1px; }
  .screen h2 { font-size: clamp(22px, 6vw, 40px); margin-bottom: 8px; text-shadow: 2px 2px 0 rgba(0,0,0,.3); }
  .screen p  { font-size: clamp(15px, 4.2vw, 20px); margin: 6px 0; max-width: 520px; line-height: 1.7; opacity: .95; }
  .play-btn {
    margin-top: 26px; padding: 16px 46px; font-size: clamp(20px, 5.5vw, 28px);
    font-weight: bold; color: #fff; background: #e8433a;
    border: 4px solid #fff; border-radius: 16px;
    box-shadow: 0 6px 0 #a52f28; cursor: pointer;
  }
  .play-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #a52f28; }
  .hint { margin-top: 20px; font-size: 14px; opacity: .85; }
  .flag { font-size: 56px; margin-bottom: 10px; }

  /* ===== شريط الحالة العلوي ===== */
  #hud {
    position: fixed; top: max(10px, env(safe-area-inset-top)); left: 0; right: 0;
    display: flex; justify-content: center; gap: 22px; z-index: 15;
    color: #fff; font-size: 18px; font-weight: bold; pointer-events: none;
    text-shadow: 2px 2px 0 rgba(0,0,0,.35);
  }
  #hud .box { background: rgba(0,0,0,.25); padding: 4px 12px; border-radius: 8px; }

  /* زر كتم الصوت */
  #btn-mute {
    position: fixed; z-index: 25;
    top: max(10px, env(safe-area-inset-top)); right: 12px;
    width: 44px; height: 44px; font-size: 22px;
    bottom: auto; pointer-events: auto;
  }
</style>
</head>
<body>
<div id="game-wrap">
  <canvas id="game" width="480" height="360"></canvas>
</div>

<div id="hud" class="hidden">
  <div class="box">🪙 <span id="hud-coins">0</span></div>
  <div class="box">المرحلة <span id="hud-level">1</span></div>
  <div class="box">❤️ <span id="hud-lives">3</span></div>
  <div class="box">🏆 <span id="hud-best">0</span></div>
</div>

<div id="btn-mute" class="btn">🔊</div>

<div id="controls" class="hidden">
  <div id="btn-left"  class="btn">◀</div>
  <div id="btn-right" class="btn">▶</div>
  <div id="btn-jump"  class="btn">⤴</div>
</div>

<!-- شاشة البداية -->
<div id="start-screen" class="screen">
  <h1>سوبر جـري</h1>
  <p>اجمع العملات 🪙، اقفز فوق الأعداء 👾، ووصّل للعلَم 🚩 في نهاية كل مرحلة!</p>
  <p style="opacity:.8">الجوال: استخدم أزرار ◀ ▶ للحركة و ⤴ للقفز.<br/>الكمبيوتر: الأسهم أو A/D للحركة، ومسافة/سهم لأعلى للقفز.</p>
  <p id="best-line" style="font-weight:bold"></p>
  <button class="play-btn" id="start-btn">▶ ابدأ اللعب</button>
  <div class="hint">اضغط على "تثبيت" في متصفحك لإضافتها كتطبيق على شاشتك</div>
</div>

<!-- شاشة الفوز/الخسارة -->
<div id="end-screen" class="screen hidden">
  <div class="flag" id="end-emoji">🏆</div>
  <h2 id="end-title">أحسنت!</h2>
  <p id="end-msg"></p>
  <button class="play-btn" id="restart-btn">🔁 العب مرة أخرى</button>
</div>

<script src="game.js"></script>
</body>
</html>
